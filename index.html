<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IT Help Desk</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">

        <div class="logo">
            <span>IT</span>
            <h2>Help Desk</h2>
        </div>

        <button class="new-ticket-btn" id="newTicketBtn">
            + New Ticket
        </button>

    </header>


    <!-- Main Container -->
    <main class="container">

        <!-- Page Title -->
        <section class="page-title">

            <div>
                <h1>Ticket Management</h1>
                <p>Manage and track your IT support requests</p>
            </div>

        </section>


        <!-- Dashboard Cards -->
        <section class="dashboard">

            <div class="stat-card total-card">
                <div class="stat-icon">📋</div>

                <div>
                    <p>Total Tickets</p>
                    <h2 id="totalTickets">0</h2>
                </div>
            </div>


            <div class="stat-card open-card">
                <div class="stat-icon">🔓</div>

                <div>
                    <p>Open</p>
                    <h2 id="openTickets">0</h2>
                </div>
            </div>


            <div class="stat-card progress-card">
                <div class="stat-icon">⚙️</div>

                <div>
                    <p>In Progress</p>
                    <h2 id="progressTickets">0</h2>
                </div>
            </div>


            <div class="stat-card resolved-card">
                <div class="stat-icon">✓</div>

                <div>
                    <p>Resolved</p>
                    <h2 id="resolvedTickets">0</h2>
                </div>
            </div>

        </section>


        <!-- Ticket Section -->
        <section class="ticket-section">

            <!-- Search and Filters -->
            <div class="controls">

                <div class="search-box">
                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search tickets..."
                    >
                </div>


                <select id="statusFilter">

                    <option value="all">
                        All Status
                    </option>

                    <option value="Open">
                        Open
                    </option>

                    <option value="In Progress">
                        In Progress
                    </option>

                    <option value="Resolved">
                        Resolved
                    </option>

                </select>


                <select id="priorityFilter">

                    <option value="all">
                        All Priority
                    </option>

                    <option value="High">
                        High
                    </option>

                    <option value="Medium">
                        Medium
                    </option>

                    <option value="Low">
                        Low
                    </option>

                </select>

            </div>


            <!-- Table -->
            <div class="table-container">

                <table>

                    <thead>

                        <tr>
                            <th>ID</th>
                            <th>Subject</th>
                            <th>User</th>
                            <th>Department</th>
                            <th>Priority</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>

                    </thead>


                    <tbody id="ticketTableBody">

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <!-- Ticket Modal -->
    <div class="modal" id="ticketModal">

        <div class="modal-content">

            <div class="modal-header">

                <h2 id="modalTitle">
                    Create New Ticket
                </h2>

                <button
                    class="close-btn"
                    id="closeModal"
                >
                    ×
                </button>

            </div>


            <form id="ticketForm">

                <input
                    type="hidden"
                    id="editTicketId"
                >


                <div class="form-row">

                    <div class="form-group">

                        <label>
                            Employee Name
                        </label>

                        <input
                            type="text"
                            id="employeeName"
                            placeholder="Enter employee name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter email"
                            required
                        >

                    </div>

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label>
                            Department
                        </label>

                        <select id="department" required>

                            <option value="">
                                Select Department
                            </option>

                            <option value="HR">
                                HR
                            </option>

                            <option value="Finance">
                                Finance
                            </option>

                            <option value="IT">
                                IT
                            </option>

                            <option value="Sales">
                                Sales
                            </option>

                            <option value="Marketing">
                                Marketing
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>
                            Category
                        </label>

                        <select id="category" required>

                            <option value="">
                                Select Category
                            </option>

                            <option value="Hardware">
                                Hardware
                            </option>

                            <option value="Software">
                                Software
                            </option>

                            <option value="Network">
                                Network
                            </option>

                            <option value="Account">
                                Account
                            </option>

                        </select>

                    </div>

                </div>


                <div class="form-group">

                    <label>
                        Priority
                    </label>

                    <select id="priority" required>

                        <option value="">
                            Select Priority
                        </option>

                        <option value="High">
                            High
                        </option>

                        <option value="Medium">
                            Medium
                        </option>

                        <option value="Low">
                            Low
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Subject
                    </label>

                    <input
                        type="text"
                        id="subject"
                        placeholder="Enter ticket subject"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Description
                    </label>

                    <textarea
                        id="description"
                        rows="4"
                        placeholder="Describe the issue..."
                        required
                    ></textarea>

                </div>


                <div class="form-actions">

                    <button
                        type="button"
                        class="cancel-btn"
                        id="cancelBtn"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="submit-btn"
                    >
                        Save Ticket
                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- Ticket Details Modal -->
    <div class="modal" id="viewModal">

        <div class="modal-content details-modal">

            <div class="modal-header">

                <h2>
                    Ticket Details
                </h2>

                <button
                    class="close-btn"
                    id="closeViewModal"
                >
                    ×
                </button>

            </div>


            <div id="ticketDetails">

            </div>

        </div>

    </div>


    <!-- Toast -->
    <div
        class="toast"
        id="toast"
    >
        Ticket saved successfully!
    </div>


    <script src="script.js"></script>

</body>

</html>
